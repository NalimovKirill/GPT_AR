<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AR Viewer</title>


<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

html,body{

margin:0;
width:100%;
height:100%;
overflow:hidden;

font-family:
-apple-system,
BlinkMacSystemFont,
"Segoe UI",
sans-serif;

background:#000;

}


#ui{

position:fixed;

inset:0;

z-index:10;

color:white;

pointer-events:none;

}



.top{

position:absolute;

top:25px;

left:20px;

right:20px;

display:flex;

justify-content:space-between;

}



.status{

background:
rgba(0,0,0,.75);

padding:14px 18px;

border-radius:20px;

font-size:16px;

backdrop-filter:blur(10px);

}



.dot{

display:inline-block;

width:12px;

height:12px;

border-radius:50%;

background:#ffc400;

margin-right:10px;

}



.dot.active{

background:#00ff66;

box-shadow:
0 0 15px #00ff66;

}



.help{

pointer-events:auto;

width:45px;

height:45px;

border-radius:50%;

border:0;

background:
rgba(0,0,0,.75);

color:white;

font-size:22px;

}




.controls{

position:absolute;

right:20px;

bottom:220px;

display:flex;

flex-direction:column;

gap:12px;

}



.controls button{

pointer-events:auto;

width:80px;

height:80px;

border:0;

border-radius:18px;

background:
rgba(0,0,0,.75);

color:white;

}



.message{

position:absolute;

left:20px;

right:20px;

bottom:110px;

background:
rgba(0,0,0,.75);

border-radius:20px;

padding:20px;

text-align:center;

}



.message h3{

margin:0 0 8px;

}



.message p{

margin:0;

opacity:.7;

}



</style>

</head>



<body>




<div id="ui">


<div class="top">


<div class="status">


<span id="dot" class="dot"></span>


<span id="status">
ПОИСК ТРИГГЕРА
</span>


</div>


<button class="help">
?
</button>


</div>




<div class="controls">


<button>
◇<br>
Модель
</button>


<button id="reset">
↻<br>
Сброс
</button>


</div>




<div class="message">


<h3 id="title">
Наведите камеру на изображение
</h3>


<p id="subtitle">
Ожидание изображения-триггера
</p>


</div>


</div>








<a-scene


mindar-image="

imageTargetSrc: ./targets.mind;

autoStart: true;

uiScanning: true;

filterMinCF: 0.0001;

filterBeta: 0.001;

maxTrack: 1;

"


color-space="sRGB"


renderer="

colorManagement:true;

physicallyCorrectLights:true;

antialias:true;

precision:high;

"


vr-mode-ui="enabled:false"


device-orientation-permission-ui="enabled:false"



>



<a-assets>


<a-asset-item

id="model"

src="./model.glb">

</a-asset-item>


</a-assets>




<a-light

type="ambient"

intensity="1.5">

</a-light>


<a-light

type="directional"

position="1 2 1"

intensity="2">

</a-light>





<a-camera

position="0 0 0"

look-controls="enabled:false">

</a-camera>






<a-entity

id="target"

mindar-image-target="
targetIndex:0">


<a-gltf-model


id="arModel"


src="#model"


position="0 0 0.5"


rotation="-90 0 0"


scale="1 1 1"


visible="false"


>

</a-gltf-model>


</a-entity>




</a-scene>









<script>


const target =
document.querySelector("#target");


const model =
document.querySelector("#arModel");


const dot =
document.querySelector("#dot");


const status =
document.querySelector("#status");


const title =
document.querySelector("#title");


const subtitle =
document.querySelector("#subtitle");




/*
Загрузка модели
*/


model.addEventListener(
"model-loaded",
()=>{

console.log(
"GLB MODEL LOADED"
);


}
);



model.addEventListener(
"model-error",
(e)=>{

console.error(
"MODEL ERROR",
e
);

title.innerHTML =
"Ошибка модели";


subtitle.innerHTML =
"Не удалось загрузить model.glb";

}

);





/*
Найден target
*/


target.addEventListener(

"targetFound",

()=>{


console.log(
"TARGET FOUND"
);



model.setAttribute(
"visible",
true
);



dot.classList.add(
"active"
);



status.innerHTML =
"ТРЕКИНГ: АКТИВЕН";



title.innerHTML =
"Модель найдена";



subtitle.innerHTML =
"3D объект отображается";



}

);







/*
Потерян target
*/


target.addEventListener(

"targetLost",

()=>{


model.setAttribute(
"visible",
false
);



dot.classList.remove(
"active"
);



status.innerHTML =
"ПОИСК ТРИГГЕРА";



title.innerHTML =
"Наведите камеру на изображение";



subtitle.innerHTML =
"Ожидание распознавания";



}

);






/*
Кнопка сброс
*/


document
.getElementById("reset")
.addEventListener(

"click",

()=>{


model.setAttribute(
"position",
"0 0 0.5"
);



model.setAttribute(
"rotation",
"-90 0 0"
);



model.setAttribute(
"scale",
"1 1 1"
);



}

);



</script>



</body>

</html>
