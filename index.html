<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AR Viewer</title>


<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
}


#ui{

position:fixed;
inset:0;
z-index:5;
color:white;
pointer-events:none;

}



.top{

position:absolute;
top:25px;
left:20px;
right:20px;

display:flex;
justify-content:space-between;

}


.status{

background:rgba(0,0,0,.7);

padding:12px 18px;

border-radius:20px;

font-size:16px;

}


.dot{

display:inline-block;

width:12px;
height:12px;

background:#ffcc00;

border-radius:50%;

margin-right:10px;

}


.dot.active{

background:#00ff66;

}



.help{

pointer-events:auto;

width:45px;
height:45px;

border-radius:50%;

border:none;

background:rgba(0,0,0,.7);

color:white;

font-size:22px;

}



.side{

position:absolute;

right:20px;

bottom:220px;

display:flex;

flex-direction:column;

gap:15px;

}


.side button{

pointer-events:auto;

background:rgba(0,0,0,.75);

border:none;

color:white;

padding:18px;

border-radius:18px;

}



.message{

position:absolute;

left:20px;
right:20px;

bottom:110px;

background:rgba(0,0,0,.75);

border-radius:20px;

padding:20px;

text-align:center;

}



</style>

</head>


<body>



<div id="ui">


<div class="top">


<div class="status">

<span id="dot" class="dot"></span>

<span id="status">
ПОИСК ТРИГГЕРА
</span>


</div>


<button class="help">
?
</button>


</div>



<div class="side">

<button>
◇<br>
Модель
</button>


<button>
↻<br>
Сброс
</button>


</div>




<div class="message">


<h3 id="title">
Наведите камеру на изображение
</h3>


<p id="subtitle">
3D модель появится автоматически
</p>


</div>


</div>






<a-scene


mindar-image="

imageTargetSrc: ./targets.mind;

autoStart: true;

filterMinCF: 0.001;

filterBeta: 0.01;

"


color-space="sRGB"


renderer="

colorManagement: true;

physicallyCorrectLights: true;

"


vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:false"



>



<a-assets>


<a-asset-item

id="model"

src="./model.glb">

</a-asset-item>


</a-assets>



<a-camera

position="0 0 0"

look-controls="enabled:false">

</a-camera>





<a-entity

mindar-image-target="targetIndex:0"

id="target">


<a-gltf-model


id="arModel"


src="#model"


position="0 0 0.1"


rotation="0 0 0"


scale="0.2 0.2 0.2"


visible="false"


>


</a-gltf-model>


</a-entity>



</a-scene>






<script>


const target =
document.querySelector("#target");


const model =
document.querySelector("#arModel");


const dot =
document.querySelector("#dot");


const status =
document.querySelector("#status");


const title =
document.querySelector("#title");


const subtitle =
document.querySelector("#subtitle");





target.addEventListener(

"targetFound",

()=>{


model.setAttribute(
"visible",
true
);


dot.classList.add(
"active"
);


status.innerHTML =
"ТРЕКИНГ: АКТИВЕН";


title.innerHTML =
"Модель найдена";


subtitle.innerHTML =
"AR объект отображается";


}

);






target.addEventListener(

"targetLost",

()=>{


model.setAttribute(
"visible",
false
);


dot.classList.remove(
"active"
);


status.innerHTML =
"ПОИСК ТРИГГЕРА";


title.innerHTML =
"Наведите камеру на изображение";


subtitle.innerHTML =
"Ожидание распознавания";


}

);



</script>



</body>

</html>
