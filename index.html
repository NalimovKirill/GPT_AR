<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AR Demo</title>

<style>

* {
  box-sizing:border-box;
}

body {
  margin:0;
  height:100vh;
  overflow:hidden;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}


/* Fake camera */

.camera {
  position:absolute;
  inset:0;

  background:
  linear-gradient(
    135deg,
    #444,
    #111
  );

  display:flex;
  align-items:center;
  justify-content:center;
}


.fake-marker {

  width:180px;
  height:180px;

  background:
  repeating-linear-gradient(
    45deg,
    #fff 0,
    #fff 10px,
    #111 10px,
    #111 20px
  );

  opacity:.35;

}


/* 3D object demo */

.cube {

 position:absolute;

 width:90px;
 height:90px;

 background:#4cc3ff;

 border-radius:20px;

 box-shadow:
 0 0 50px #4cc3ff;

 transform:
 perspective(400px)
 rotateX(25deg)
 rotateY(35deg);

 animation:
 float 3s infinite ease-in-out;

 display:none;

}


@keyframes float {

0%,100%{
 transform:
 perspective(400px)
 rotateX(25deg)
 rotateY(35deg)
 translateY(0);
}

50%{
 transform:
 perspective(400px)
 rotateX(25deg)
 rotateY(35deg)
 translateY(-40px);
}

}


/* UI */

.ui {

position:absolute;
inset:0;

color:white;

}


/* top */

.top {

position:absolute;

top:25px;
left:20px;
right:20px;

display:flex;

justify-content:space-between;

}


.status {

background:
rgba(20,20,20,.75);

padding:14px 18px;

border-radius:20px;

display:flex;

gap:10px;

align-items:center;

font-size:15px;

}


.dot {

width:12px;
height:12px;

border-radius:50%;

background:#f5c542;

}


.dot.active {

background:#50e878;

}



/* help */

.help {

width:45px;
height:45px;

border-radius:50%;

border:none;

background:
rgba(20,20,20,.8);

color:white;

font-size:22px;

}



/* right buttons */

.controls {

position:absolute;

right:20px;

bottom:220px;

display:flex;

flex-direction:column;

gap:12px;

}


.control {

width:80px;
height:80px;

border:none;

border-radius:18px;

background:
rgba(20,20,20,.8);

color:white;

font-size:13px;

}


/* message */

.message {

position:absolute;

left:20px;
right:20px;

bottom:120px;

background:
rgba(20,20,20,.85);

border-radius:20px;

padding:20px;

}


.message h3 {

margin:0 0 8px;

font-size:17px;

}


.message p {

margin:0;

opacity:.7;

}


/* bottom */

.bottom {

position:absolute;

bottom:0;

left:0;
right:0;

height:90px;

background:#111;

display:flex;

justify-content:space-around;

align-items:center;

}


.nav {

background:none;

border:none;

color:white;

display:flex;

flex-direction:column;

gap:5px;

}


/* start */

.start {

position:absolute;

inset:0;

background:#111;

z-index:5;

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

color:white;

text-align:center;

padding:30px;

}


.start h1 {

font-size:32px;

}


.start p {

opacity:.7;

max-width:300px;

}


.start button {

margin-top:30px;

width:100%;

max-width:300px;

padding:18px;

border-radius:18px;

border:none;

font-size:17px;

font-weight:bold;

}



.hidden {

display:none;

}


</style>

</head>


<body>


<div class="camera">

<div class="fake-marker"></div>

<div id="cube" class="cube"></div>

</div>



<div id="start" class="start">

<h1>
AR-просмотр
</h1>

<p>
Наведите камеру на изображение-триггер,
чтобы увидеть 3D-модель
</p>


<button onclick="startDemo()">
Запустить AR
</button>

</div>



<div class="ui">


<div class="top">


<div class="status">

<span id="dot" class="dot"></span>

<span id="status">
ТРЕКИНГ: ПОИСК
</span>

</div>


<button class="help">
?
</button>


</div>




<div class="controls">


<button class="control">
◇<br>
Модель
</button>


<button class="control">
↻<br>
Сбросить
</button>


<button class="control">
⛶<br>
Экран
</button>


</div>




<div class="message">

<h3 id="title">
Наведите камеру на изображение-триггер
</h3>

<p id="subtitle">
3D-модель появится автоматически
</p>

</div>




<div class="bottom">


<button class="nav">
ⓘ
<br>
Инструкция
</button>


<button class="nav">
▣
<br>
Триггер
</button>


<button class="nav">
⚙
<br>
Настройки
</button>


</div>


</div>



<script>


function startDemo(){


document
.getElementById("start")
.classList.add("hidden");


document
.getElementById("dot")
.classList.add("active");


document
.getElementById("status")
.innerHTML =
"ТРЕКИНГ: АКТИВЕН";


document
.getElementById("title")
.innerHTML =
"Изображение распознано";


document
.getElementById("subtitle")
.innerHTML =
"3D-модель привязана к поверхности";


document
.getElementById("cube")
.style.display =
"block";


}



</script>


</body>
</html>
