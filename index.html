<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AR Model Viewer</title>


<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

html,body{

margin:0;
padding:0;

width:100%;
height:100%;

overflow:hidden;

font-family:
Arial,
sans-serif;

background:black;

}


#ui{

position:fixed;

inset:0;

z-index:10;

color:white;

pointer-events:none;

}



.top{

position:absolute;

top:25px;

left:20px;

right:20px;

display:flex;

justify-content:space-between;

}



.status{

background:
rgba(0,0,0,.75);

padding:15px 20px;

border-radius:20px;

}



.dot{

display:inline-block;

width:12px;

height:12px;

border-radius:50%;

background:#ffcc00;

margin-right:10px;

}


.dot.active{

background:#00ff55;

}



.help{

pointer-events:auto;

width:45px;

height:45px;

border-radius:50%;

border:none;

background:black;

color:white;

font-size:22px;

}



.message{

position:absolute;

left:20px;

right:20px;

bottom:40px;

background:
rgba(0,0,0,.75);

border-radius:20px;

padding:20px;

text-align:center;

}



</style>


</head>


<body>



<div id="ui">


<div class="top">


<div class="status">

<span id="dot" class="dot"></span>

<span id="status">

ПОИСК ТРИГГЕРА

</span>

</div>


<button class="help">

?

</button>


</div>



<div class="message">


<h3 id="title">

Наведите камеру на изображение

</h3>


<p id="subtitle">

Ожидание AR объекта

</p>


</div>


</div>





<a-scene


mindar-image="

imageTargetSrc: ./targets.mind;

autoStart:true;

filterMinCF:0.0001;

filterBeta:0.001;

maxTrack:1;

"


renderer="

colorManagement:true;

physicallyCorrectLights:true;

antialias:true;

"


color-space="sRGB"


vr-mode-ui="enabled:false"


device-orientation-permission-ui="enabled:false"



>



<!-- Свет -->


<a-light

type="ambient"

intensity="2">

</a-light>


<a-light

type="directional"

position="0 2 1"

intensity="2">

</a-light>





<!-- Камера -->


<a-camera

position="0 0 0"

look-controls="enabled:false">

</a-camera>






<!-- TARGET -->


<a-entity

id="target"

mindar-image-target="targetIndex:0">





<!-- GLB -->


<a-gltf-model


id="arModel"


src="./model.glb"


position="0 0 1"


rotation="0 0 0"


scale="5 5 5"


visible="false"


></a-gltf-model>





</a-entity>






</a-scene>









<script>


const target =
document.querySelector("#target");


const model =
document.querySelector("#arModel");


const dot =
document.querySelector("#dot");


const status =
document.querySelector("#status");


const title =
document.querySelector("#title");


const subtitle =
document.querySelector("#subtitle");






// Проверка загрузки модели


model.addEventListener(
"model-loaded",
()=>{


console.log(
"MODEL LOADED"
);


title.innerHTML =
"Модель загружена";


subtitle.innerHTML =
"Ожидание распознавания";


});




model.addEventListener(
"model-error",
(error)=>{


console.error(
"MODEL ERROR",
error
);


title.innerHTML =
"Ошибка загрузки GLB";


subtitle.innerHTML =
"Проверь model.glb";


});







// Найдено изображение


target.addEventListener(

"targetFound",

()=>{


console.log(
"TARGET FOUND"
);



model.setAttribute(
"visible",
true
);



model.object3D.visible=true;



dot.classList.add(
"active"
);



status.innerHTML =
"ТРЕКИНГ: АКТИВЕН";



title.innerHTML =
"Модель найдена";



subtitle.innerHTML =
"3D объект отображается";



}

);







// Потерян target


target.addEventListener(

"targetLost",

()=>{


model.setAttribute(
"visible",
false
);



dot.classList.remove(
"active"
);



status.innerHTML =
"ПОИСК";



title.innerHTML =
"Наведите камеру";



subtitle.innerHTML =
"Ожидание изображения";


}

);




</script>



</body>

</html>
